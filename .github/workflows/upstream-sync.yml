name: Upstream sync

on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'salileoss/Bilibili-thread-ripper' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.prepare.outputs.status }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Prepare in a disposable clone (no write token or secrets)
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/upstream-sync.mjs prepare "$RUNNER_TEMP/upstream-candidate"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: upstream-candidate
          path: ${{ runner.temp }}/upstream-candidate/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  push:
    needs: prepare
    if: always() && !cancelled() && needs.prepare.outputs.status != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      status: ${{ steps.push.outputs.status }}
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Optional repository-scoped App token
        id: app
        if: vars.UPSTREAM_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UPSTREAM_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPSTREAM_APP_PRIVATE_KEY }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: upstream-candidate
          path: ${{ runner.temp }}/upstream-candidate
      - name: Push Git objects and maintain the update PR (no candidate execution)
        id: push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
        run: node scripts/upstream-control.mjs push "$RUNNER_TEMP/upstream-candidate"

  tests:
    needs: push
    if: needs.push.outputs.status == 'candidate'
    # The reusable workflow limits candidate execution jobs to contents: read.
    # Its Canary job declares write access but is disabled whenever inputs.ref is set.
    permissions:
      contents: write
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.push.outputs.sha }}
      online: true

  finish:
    needs: [push, tests]
    if: always() && needs.push.outputs.status == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - id: app
        if: vars.UPSTREAM_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.UPSTREAM_APP_CLIENT_ID }}
          private-key: ${{ secrets.UPSTREAM_APP_PRIVATE_KEY }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: upstream-candidate
          path: ${{ runner.temp }}/upstream-candidate
      - name: Record exact-commit result and optionally enable guarded auto-merge
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          TEST_RESULT: ${{ needs.tests.result }}
          HAS_APP: ${{ steps.app.outputs.token != '' }}
          UPSTREAM_AUTO_MERGE: ${{ vars.UPSTREAM_AUTO_MERGE }}
        run: node scripts/upstream-control.mjs finish "$RUNNER_TEMP/upstream-candidate"
